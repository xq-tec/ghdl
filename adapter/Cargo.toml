[package]
name = "ghdl-adapter"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
compact_str = { version = "0.9", features = ["serde", "smallvec"] }
crossbeam-channel = "0.5"
futures-util = "0.3"
ghdl-ast = { path = "../ghdl-ast" }
hdl-simulation-protocol = { path = "../hdl-simulation-protocol" }
libc = "0.2"
opentelemetry = { version = "0.31", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.31", features = [
    "trace",
    "logs",
    "rt-tokio",
] }
opentelemetry-appender-tracing = { version = "0.31", features = [
    "experimental_metadata_attributes",
] }
opentelemetry-otlp = { version = "0.31", features = [
    "grpc-tonic",
    "trace",
    "logs",
] }
postcard = { version = "1", features = ["alloc"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "rt",
    "net",
    "sync",
    "time",
    "macros",
] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-core = ">=0.1.33"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = [
    "registry",
    "std",
    "fmt",
    "env-filter",
] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
