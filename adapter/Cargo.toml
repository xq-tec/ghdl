[package]
name = "ghdl-adapter"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
hdl-simulation-protocol = { path = "../hdl-simulation-protocol" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
