[package]
name = "ghdl-adapter"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
compact_str = { version = "0.9", features = ["serde", "smallvec"] }
crossbeam-channel = "0.5"
futures-util = "0.3"
hdl-simulation-protocol = { path = "../hdl-simulation-protocol" }
postcard = { version = "1", features = ["alloc"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.26"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
