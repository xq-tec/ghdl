name: Build, Package and Test GHDL

on:
  push:
  pull_request:

jobs:
# Windows Standalone - ZIP
#   UCRT64 - llvm

# pyGHDL wheel
#   macOS
#     Python 3.10
#     Python 3.11
#     Python 3.12

# cleanups
#   libghdl-
#   pyGHDL-Coverage-
#   pyGHDL-Unittesting-
#   pyGHDL-typing-

# after PyPI upload
#   pyGHDL-Windows-
#   pyGHDL-Ubuntu-

  Params:
    uses: ./.github/workflows/Parameters.yml
    with:
      package_name: "ghdl"
      library_name: "libghdl"
      pyghdl_name:  "pyGHDL"
#      testsuites:   "sanity"         # disable parameter to fall back to 'all'

  macOS:
    uses: ./.github/workflows/Build-MacOS.yml
    needs:
      - Params
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS-13 is the last Intel x86_64 release (mcode backend only)
          - {'icon': '🍎🟨', 'macos_image': 'macos-13', 'gnat_arch': 'x86_64', 'gnat_version': '14.2.0-1', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}
    with:
      macos_image:              ${{ matrix.macos_image }}
      gnat_arch:                ${{ matrix.gnat_arch }}
      gnat_version:             ${{ matrix.gnat_version }}
      testsuites:               ${{ matrix.testsuites }}
      macos_artifact:           ${{ needs.Params.outputs.ghdl_basename }}-${{ matrix.macos_image }}-${{ matrix.gnat_arch }}
      pyunit_testsuites:        'testsuite/pyunit/libghdl testsuite/pyunit/lsp'
      unittest_xml_artifact:    'pyGHDL-Unittest-XML'
      coverage_sqlite_artifact: 'pyGHDL-Coverage-SQLite'
    secrets: inherit

  # "-fast" matrix jobs where split of, to enhance overall runtime.
  # dependent jobs (pyGHDL, documentation, etc.) are enabled earlier.
  Ubuntu-fast:
    uses: ./.github/workflows/Build-Ubuntu.yml
    needs:
      - Params
    strategy:
      fail-fast: false
      matrix:
        include:
          - {'icon': '🐧🟨', 'ubuntu_version': '22.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}
          - {'icon': '🐧🟩', 'ubuntu_version': '24.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}
    with:
      ubuntu_version:           ${{ matrix.ubuntu_version }}
      testsuites:               ${{ matrix.testsuites }}
      ubuntu_artifact:          ${{ needs.Params.outputs.ghdl_basename }}-ubuntu-${{ matrix.ubuntu_version }}-x86_64
      libghdl_artifact:         ${{ needs.Params.outputs.libghdl_basename }}-ubuntu-${{ matrix.ubuntu_version }}-x86_64
      pyunit_testsuites:        'testsuite/pyunit/libghdl testsuite/pyunit/lsp'
      unittest_xml_artifact:    'pyGHDL-Unittest-XML'
      coverage_sqlite_artifact: 'pyGHDL-Coverage-SQLite'
    secrets: inherit

  # "-fast" matrix jobs where split of, to enhance overall runtime.
  # dependent jobs (pyGHDL, documentation, etc.) are enabled earlier.
  Windows-fast:
    uses: ./.github/workflows/Build-MSYS2.yml
    needs:
      - Params
    strategy:
      fail-fast: false
      matrix:
        include:
          - {'icon': '🪟', 'runtime': 'ucrt64', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}
    with:
      runtime:                  ${{ matrix.runtime }}
      testsuites:               ${{ matrix.testsuites }}
      msys2_artifact:           ${{ needs.Params.outputs.ghdl_basename }}-MSYS2
      pacman_artifact:          ${{ needs.Params.outputs.ghdl_basename }}-Pacman
      windows_artifact:         ${{ needs.Params.outputs.ghdl_basename }}-Windows
      libghdl_artifact:         ${{ needs.Params.outputs.libghdl_basename }}-MSYS2
      pyunit_testsuites:        'testsuite/pyunit/libghdl testsuite/pyunit/lsp'
      unittest_xml_artifact:    'pyGHDL-Unittest-XML'
      coverage_sqlite_artifact: 'pyGHDL-Coverage-SQLite'
    secrets: inherit

  Windows:
    uses: ./.github/workflows/Build-MSYS2.yml
    needs:
      - Params
    strategy:
      fail-fast: false
      matrix:
        include:
          - {'icon': '🪟', 'runtime': 'mingw64', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}
          - {'icon': '🪟', 'runtime': 'ucrt64', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}
    with:
      runtime:                  ${{ matrix.runtime }}
      testsuites:               ${{ matrix.testsuites }}
      msys2_artifact:           ${{ needs.Params.outputs.ghdl_basename }}-MSYS2
      pacman_artifact:          ${{ needs.Params.outputs.ghdl_basename }}-Pacman
      windows_artifact:         ${{ needs.Params.outputs.ghdl_basename }}-Windows
      libghdl_artifact:         ${{ needs.Params.outputs.libghdl_basename }}-MSYS2
      pyunit_testsuites:        'testsuite/pyunit/libghdl testsuite/pyunit/lsp'
      unittest_xml_artifact:    'pyGHDL-Unittest-XML'
      coverage_sqlite_artifact: 'pyGHDL-Coverage-SQLite'
    secrets: inherit

  Python:
    uses: ./.github/workflows/Check-pyGHDL.yml
    needs:
      - Params

  StaticTypeCheck:
    uses: pyTooling/Actions/.github/workflows/StaticTypeCheck.yml@r3
    needs:
      - Params
    with:
      requirements: mypy lxml
      commands: |
        mypy --html-report htmlmypy -p pyGHDL
      html_report: 'htmlmypy'
      html_artifact: 'pyGHDL-typing-HTML'

  DocCoverage:
    uses: pyTooling/Actions/.github/workflows/CheckDocumentation.yml@r3
    needs:
      - Params
    with:
      directory: pyGHDL

  pyGHDL:
    uses: ./.github/workflows/Package-pyGHDL.yml
    needs:
      - Params
      - Ubuntu-fast
      - Windows-fast
    strategy:
      fail-fast: false
      matrix:
        os:
          - {'icon': '🐧', 'name': 'Ubuntu',  'image': 'ubuntu-24.04', 'libghdl_artifact': 'ubuntu-24.04-x86_64', 'pyghdl_artifact': 'Ubuntu-24.04-x86_64'}
###       - {'icon': '🍏', 'name': 'macOS',   'image': 'macos-14',     'libghdl_artifact': 'macos-14-aarch64',    'pyghdl_artifact': 'macOS-14-aarch64'}
          - {'icon': '🪟', 'name': 'Windows', 'image': 'windows-2022', 'libghdl_artifact': 'MSYS2-ucrt64',        'pyghdl_artifact': 'Windows-x86_64'}
        py:
          - {'icon': '🔴', 'version': "3.9"}
          - {'icon': '🟠', 'version': "3.10"}
          - {'icon': '🟡', 'version': "3.11"}
          - {'icon': '🟢', 'version': "3.12"}
          - {'icon': '🟢', 'version': "3.13"}
    with:
      os_name:               ${{ matrix.os.name }}
      os_image:              ${{ matrix.os.image }}
      python_icon:           ${{ matrix.py.icon }}
      python_version:        ${{ matrix.py.version }}
      libghdl_artifact:      ${{ needs.Params.outputs.libghdl_basename }}-${{ matrix.os.libghdl_artifact }}
      pyghdl_artifact:       ${{ needs.Params.outputs.pyghdl_basename }}-${{ matrix.os.pyghdl_artifact }}-Python-${{ matrix.py.version }}
      pyunit_testsuites:     'testsuite/pyunit/libghdl testsuite/pyunit/lsp'
      unittest_xml_artifact: 'pyGHDL-Unittest-XML'
    secrets: inherit

  PublishCoverageResults:
    uses: pyTooling/Actions/.github/workflows/PublishCoverageResults.yml@r3
    needs:
      - macOS
      - Ubuntu-fast
      - Windows-fast
###   - pyGHDL         # pyGHDL is installed into site-packages, where no coverage is collected -> empty coverage report
    with:
      coverage_artifacts_pattern: '*-Coverage-SQLite-*'
      coverage_json_artifact: 'pyGHDL-Coverage-JSON'
      coverage_html_artifact: 'pyGHDL-Coverage-HTML'
    secrets:
      codacy_token: ${{ secrets.CODACY_PROJECT_TOKEN }}

  PublishTestResults:
    uses: pyTooling/Actions/.github/workflows/PublishTestResults.yml@r3
    needs:
      - macOS
      - Ubuntu-fast
      - Windows-fast
      - pyGHDL
    with:
      unittest_artifacts_pattern: '*-Unittest-XML-*'
      merged_junit_artifact: 'pyGHDL-Unittest-XML'
      additional_merge_args: '-d "--render=tree" "--name=pyGHDL" "--pytest=rewrite-dunder-init;reduce-depth:pytest.testsuite.pyunit;split:pytest"'
      publish: ${{ github.event_name != 'pull_request' }}

  IntermediateCleanUp:
    uses: pyTooling/Actions/.github/workflows/IntermediateCleanUp.yml@r3
    needs:
      - PublishCoverageResults
      - PublishTestResults
    with:
      sqlite_coverage_artifacts_prefix: 'pyGHDL-Coverage-SQLite-'
      xml_unittest_artifacts_prefix: 'pyGHDL-Unittest-XML-'

#  GNATdoc:
#    uses: ./.github/workflows/Documentation-GNAT.yml
#    with:
#      ubuntu_image:  "ubuntu-20.04"            # gnat-gps (incl. GNATdoc) is limited to Ubuntu 20.04
#      html_artifact: "documentation-gnatdoc"

  Sphinx:
    uses: ./.github/workflows/Documentation-Sphinx.yml
    needs:
      - Params
      - Ubuntu-fast
      - PublishCoverageResults
      - PublishTestResults
    with:
      ghdl_artifact:  ${{ needs.Params.outputs.ghdl_basename }}-ubuntu-24.04-x86_64-mcode
      html_artifact:  'documentation-HTML'
      latex_document: 'ghdl'
      latex_artifact: 'documentation-LaTeX'
##      pdf_artifact:    'documentation-PDF'

  PublishToGitHubPages:
    uses: ./.github/workflows/Publish-GitHubPages.yml
    needs:
      - Sphinx
      - PublishCoverageResults
    with:
      documentation: 'documentation-HTML'
      coverage:      'pyGHDL-Coverage-HTML'
      typing:        'pyGHDL-typing-HTML'

  Nightly:
    uses: pyTooling/Actions/.github/workflows/NightlyRelease.yml@r3
    needs:
      - Params
      - macOS
      - Ubuntu-fast
      - Windows-fast
      - Windows
      - Python
#      - Sphinx
    if: github.ref == 'refs/tags/nightly'
    secrets: inherit
    permissions:
      contents: write
      actions: write
      attestations: write
    with:
      prerelease: true
      replacements: |
        ghdl=${{ needs.Params.outputs.ghdl_version }}
        pyghdl=${{ needs.Params.outputs.pyghdl_version }}
        pacghdl=${{ needs.Params.outputs.pacghdl_version }}
      nightly_name: nightly
      nightly_description: |
        This *nightly* release contains all latest and important artifacts created by GHDL's CI pipeline.

        # GHDL %ghdl%

        This fork builds GHDL with the **mcode** backend only (in-memory code generation).

        The following asset categories are provided for GHDL:
        * macOS 13 (x86-64) builds as TAR/GZ file
        * Ubuntu 22.04 and 24.04 (x86-64) builds as TAR/GZ file
        * Windows builds for standalone usage (without MSYS2) as ZIP file
        * MSYS2 packages as TAR/ZST file

        ## Docker Images

        Latest docker images at pushed to [Docker Hub - ghdl/ghdl:latest](https://hub.docker.com/r/ghdl/ghdl/tags).

        # pyGHDL %ghdl%

        The Python package `pyGHDL` offers Python binding (`pyGHDL.libghdl`) to a `libghdl` shared library (`*.so`/`*.dll`).
        In addition to the low-level binding layer, pyGHDL offers:
        * a Language Server Protocol (LSP) instance for e.g. live code checking by editors
        * a Code Document Object Model (CodeDOM) based on [pyVHDLModel](https://github.com/VHDL/pyVHDLModel)

        The following asset categories are provided for pyGHDL:
        * Platform specific Python wheel package for Ubuntu incl. `pyGHDL...so`
        * Platform specific Python wheel package for Windows incl. `pyGHDL...dll`
      assets: |
        ghdl-macos-13-x86_64-mcode:            $ghdl-mcode-%ghdl%-macos13-x86_64.tar.gz:                      GHDL - v%ghdl% - macOS 13 (x86-64) - mcode backend
        ghdl-ubuntu-22.04-x86_64-mcode:        $ghdl-mcode-%ghdl%-ubuntu22.04-x86_64.tar.gz:                 GHDL - v%ghdl% - Ubuntu 22.04 (x86-64) - mcode backend
        ghdl-ubuntu-24.04-x86_64-mcode:        $ghdl-mcode-%ghdl%-ubuntu24.04-x86_64.tar.gz:                  GHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - mcode backend
        ghdl-Pacman-mingw64-mcode:              mingw-w64-x86_64-ghdl-mcode-%pacghdl%-any.pkg.tar.zst:        GHDL - v%ghdl% - MSYS2/MinGW64 - mcode backend
        ghdl-Pacman-ucrt64-mcode:               mingw-w64-ucrt-x86_64-ghdl-mcode-%pacghdl%-any.pkg.tar.zst:   GHDL - v%ghdl% - MSYS2/UCRT64 - mcode backend
        ghdl-Windows-mingw64-mcode:            !ghdl-mcode-%ghdl%-mingw64.zip:                                GHDL - v%ghdl% - Windows (x86-64, MinGW64, standalone) - mcode backend
        ghdl-Windows-ucrt64-mcode:             !ghdl-mcode-%ghdl%-ucrt64.zip:                                 GHDL - v%ghdl% - Windows (x86-64, UCRT64, standalone) - mcode backend
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.9:  pyGHDL-%pyghdl%-cp39-cp39-linux_x86_64.whl:                   pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.9
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.10: pyGHDL-%pyghdl%-cp310-cp310-linux_x86_64.whl:                 pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.10
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.11: pyGHDL-%pyghdl%-cp311-cp311-linux_x86_64.whl:                 pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.11
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.12: pyGHDL-%pyghdl%-cp312-cp312-linux_x86_64.whl:                 pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.12
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.13: pyGHDL-%pyghdl%-cp313-cp313-linux_x86_64.whl:                 pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.13
        pyGHDL-Windows-x86_64-Python-3.9:       pyGHDL-%pyghdl%-cp39-cp39-win_amd64.whl:                      pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.9
        pyGHDL-Windows-x86_64-Python-3.10:      pyGHDL-%pyghdl%-cp310-cp310-win_amd64.whl:                    pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.10
        pyGHDL-Windows-x86_64-Python-3.11:      pyGHDL-%pyghdl%-cp311-cp311-win_amd64.whl:                    pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.11
        pyGHDL-Windows-x86_64-Python-3.12:      pyGHDL-%pyghdl%-cp312-cp312-win_amd64.whl:                    pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.12
        pyGHDL-Windows-x86_64-Python-3.13:      pyGHDL-%pyghdl%-cp313-cp313-win_amd64.whl:                    pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.13


  Release:
    uses: pyTooling/Actions/.github/workflows/NightlyRelease.yml@r3
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - Params
      - macOS
      - Ubuntu-fast
      - Windows-fast
      - Windows
      - Python
#      - PublishToGitHubPages
#      - StaticTypeCheck
#      - DocCoverage
      - PublishCoverageResults
      - PublishTestResults
    secrets: inherit
    permissions:
      contents: write
      actions: write
      attestations: write
    with:
      prerelease: true
      replacements: |
        ghdl=${{ needs.Params.outputs.ghdl_version }}
        pyghdl=${{ needs.Params.outputs.pyghdl_version }}
        pacghdl=${{ needs.Params.outputs.pacghdl_version }}
      nightly_name: nightly
      nightly_description: |
        # GHDL %ghdl%

        This fork builds GHDL with the **mcode** backend only (in-memory code generation).

        The following asset categories are provided for GHDL:
        * macOS 13 (x86-64) builds as TAR/GZ file
        * Ubuntu 22.04 and 24.04 (x86-64) builds as TAR/GZ file
        * Windows builds for standalone usage (without MSYS2) as ZIP file
        * MSYS2 packages as TAR/ZST file

        ## Docker Images

        Latest docker images at pushed to [Docker Hub - ghdl/ghdl:latest](https://hub.docker.com/r/ghdl/ghdl/tags).

        # pyGHDL %ghdl%

        The Python package `pyGHDL` offers Python binding (`pyGHDL.libghdl`) to a `libghdl` shared library (`*.so`/`*.dll`).
        In addition to the low-level binding layer, pyGHDL offers:
        * a Language Server Protocol (LSP) instance for e.g. live code checking by editors
        * a Code Document Object Model (CodeDOM) based on [pyVHDLModel](https://github.com/VHDL/pyVHDLModel)

        The following asset categories are provided for pyGHDL:
        * Platform specific Python wheel package for Ubuntu incl. `pyGHDL...so`
        * Platform specific Python wheel package for Windows incl. `pyGHDL...dll`
      assets: |
        ghdl-macos-13-x86_64-mcode:            $ghdl-mcode-%ghdl%-macos13-x86_64.tar.gz:                      GHDL - v%ghdl% - macOS 13 (x86-64) - mcode backend
        ghdl-ubuntu-22.04-x86_64-mcode:        $ghdl-mcode-%ghdl%-ubuntu22.04-x86_64.tar.gz:                 GHDL - v%ghdl% - Ubuntu 22.04 (x86-64) - mcode backend
        ghdl-ubuntu-24.04-x86_64-mcode:        $ghdl-mcode-%ghdl%-ubuntu24.04-x86_64.tar.gz:                  GHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - mcode backend
        ghdl-Pacman-mingw64-mcode:              mingw-w64-x86_64-ghdl-mcode-%pacghdl%-any.pkg.tar.zst:        GHDL - v%ghdl% - MSYS2/MinGW64 - mcode backend
        ghdl-Pacman-ucrt64-mcode:               mingw-w64-ucrt-x86_64-ghdl-mcode-%pacghdl%-any.pkg.tar.zst:   GHDL - v%ghdl% - MSYS2/UCRT64 - mcode backend
        ghdl-Windows-mingw64-mcode:            !ghdl-mcode-%ghdl%-mingw64.zip:                                GHDL - v%ghdl% - Windows (x86-64, MinGW64, standalone) - mcode backend
        ghdl-Windows-ucrt64-mcode:             !ghdl-mcode-%ghdl%-ucrt64.zip:                                 GHDL - v%ghdl% - Windows (x86-64, UCRT64, standalone) - mcode backend
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.9:  pyGHDL-%pyghdl%-cp39-cp39-linux_x86_64.whl:                   pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.9
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.10: pyGHDL-%pyghdl%-cp310-cp310-linux_x86_64.whl:                 pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.10
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.11: pyGHDL-%pyghdl%-cp311-cp311-linux_x86_64.whl:                 pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.11
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.12: pyGHDL-%pyghdl%-cp312-cp312-linux_x86_64.whl:                 pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.12
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.13: pyGHDL-%pyghdl%-cp313-cp313-linux_x86_64.whl:                 pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.13
        pyGHDL-Windows-x86_64-Python-3.9:       pyGHDL-%pyghdl%-cp39-cp39-win_amd64.whl:                      pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.9
        pyGHDL-Windows-x86_64-Python-3.10:      pyGHDL-%pyghdl%-cp310-cp310-win_amd64.whl:                    pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.10
        pyGHDL-Windows-x86_64-Python-3.11:      pyGHDL-%pyghdl%-cp311-cp311-win_amd64.whl:                    pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.11
        pyGHDL-Windows-x86_64-Python-3.12:      pyGHDL-%pyghdl%-cp312-cp312-win_amd64.whl:                    pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.12
        pyGHDL-Windows-x86_64-Python-3.13:      pyGHDL-%pyghdl%-cp313-cp313-win_amd64.whl:                    pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.13
